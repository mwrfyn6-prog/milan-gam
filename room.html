<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17151d" />
    <title>غرفة اللعب | ميلان</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="room.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-config.js"></script>
    <script src="room.js" defer></script>
  </head>
  <body>
    <div class="room-shell">
      <header class="room-header">
        <a class="brand" href="index.html" aria-label="العودة إلى ميلان">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>MILAN<span class="brand-dot">.</span></span>
        </a>
        <div class="room-heading">
          <span id="game-label" class="eyebrow">غرفة ميلان</span>
          <h1 id="room-title">جاري فتح الغرفة...</h1>
        </div>
        <div class="room-code-box">
          <span>رمز الغرفة</span>
          <strong id="room-code">------</strong>
          <button id="copy-code" class="icon-button" type="button" aria-label="نسخ رمز الغرفة">نسخ</button>
        </div>
      </header>

      <p class="status-banner" id="status-message" role="status" aria-live="polite">جاري الاتصال بالغرفة...</p>

      <main class="room-layout">
        <section class="game-panel" aria-live="polite">
          <div class="game-content" id="game-content"></div>
        </section>
        <aside class="players-panel">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">فريق اللعب</span>
              <h2>اللاعبون</h2>
            </div>
            <span class="player-count" id="player-count"></span>
          </div>
          <ul class="player-list" id="player-list"></ul>
          <button class="leave-button" id="leave-room" type="button" hidden>مغادرة الغرفة</button>
        </aside>
      </main>
      <footer class="room-footer">
        <span>اللعب يجمعنا</span>
        <button id="room-login" class="login-button" type="button" hidden>تسجيل الدخول عبر Discord</button>
        <a href="index.html#games">العودة للألعاب</a>
      </footer>
    </div>

    <div class="result-overlay" id="result-overlay" hidden>
      <div class="result-card">
        <span class="result-spark" aria-hidden="true">✦</span>
        <p class="eyebrow">نهاية الجولة</p>
        <h2 id="result-title"></h2>
        <p id="result-description"></p>
        <button class="primary-button" id="result-close" type="button">عرض النتيجة</button>
      </div>
    </div>
  </body>
</html>
